name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # One command per step: `&&` is not portable across the default shells
      # of ubuntu, macos and windows runners.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: The console script is on PATH
        run: veyra --version

  audit:
    name: live audit of the demo crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Report the toolchain this run will use
        run: |
          cargo --version
          rustc --version

      # Unit tests mock subprocess, so they cannot catch a broken tool
      # invocation. This runs the real thing: real cargo, real exit codes,
      # and then a check that the evidence on disk matches the claim.
      - name: Run the auditor and verify its evidence
        run: python scripts/ci_assert_evidence.py tests/fixtures/demo_crate
