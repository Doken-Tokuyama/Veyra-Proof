name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # One command per step: `&&` is not portable across the default shells
      # of ubuntu, macos and windows runners.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: The console script is on PATH
        run: veyra --version

  audit:
    name: live audit of the demo crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # `quick` makes cargo-audit required as soon as the target has a lockfile,
      # and the runner images do not ship it. Without the binary the auditor
      # exits 2 (missing prerequisites), which is not a verdict and fails here.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Report the toolchain this run will use
        run: |
          cargo --version
          rustc --version

      # Unit tests mock subprocess, so they cannot catch a broken tool
      # invocation. This runs the real thing: real cargo, real exit codes,
      # and then a check that the evidence on disk matches the claim.
      - name: Run the auditor and verify its evidence
        run: python scripts/ci_assert_evidence.py tests/fixtures/demo_crate

  account-skill:
    name: account skill copy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Advisory by design, and the script is standard library only, so this
      # job installs nothing. The Freebuff Desktop store is machine-local and
      # owned by that app: a stale Cloud cache on one contributor's machine must
      # not fail somebody else's pull request, and nothing here can repair it.
      # Drift is therefore reported as an annotation and in the run summary while
      # the step stays green. Only a defect in the check itself fails the job —
      # exit 2 or worse means the checker is broken, which is a bug in this repo.
      # On GitHub's own runners there is no store, so this reports 'no account
      # store' and passes; its value is on a self-hosted runner or a developer
      # machine that has one.
      - name: Report whether the account copy matches the canonical skill
        shell: bash
        run: |
          set +e
          python scripts/check_account_skill.py > account-skill.txt 2>&1
          status=$?
          set -e
          cat account-skill.txt

          {
            echo "### Account skill copy"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Current, or no store on this runner."
            else
              echo "**The account copy does not match the canonical skill.**"
            fi
            echo
            echo '```'
            cat account-skill.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0)
              exit 0
              ;;
            1)
              echo "::warning title=Account skill copy lags::The Freebuff Desktop account copy is older than the canonical skill. Remove the synced entry in the app's skill manager so the next sync re-imports it. Advisory: a machine-local cache never fails this build."
              exit 0
              ;;
            *)
              echo "::error title=Account skill check failed::scripts/check_account_skill.py exited $status, which is a defect in the check rather than a stale cache."
              exit "$status"
              ;;
          esac
