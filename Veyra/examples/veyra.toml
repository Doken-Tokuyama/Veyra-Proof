# Optional Veyra configuration.
#
# Veyra never creates this file for you and never edits Cargo.toml. Copy it to
# the root of a Cargo workspace and keep only the keys you actually need.
#
# Anything left commented keeps the built-in default.

[project]
# Paths that carry the most risk. Empty means "scan everything".
critical_paths = []
# critical_paths = ["src/auth", "src/payments"]

[policy]
# Every key below is optional. Uncomment only what you want to change.
#
# install_missing        = false   # allow `cargo install` of missing tools
# update_lockfile        = false   # allow `cargo update`
# allow_manifest_changes = false   # reserved; V1 performs no manifest edits
# anti_theater           = true    # heuristic scan for theatrical / fake code

# Fuzzing is only attempted for targets that really exist. Do not invent paths:
# a configured-but-absent target is reported as SKIPPED with that reason.
#
# [[fuzz]]
# path = "fuzz_targets"
# targets = ["parse_fuzzer"]

# [[mutants]]
# paths = ["src/critical"]

# End-to-end behavior: veyra builds the workspace and runs the binary cargo
# produced through each declared journey, comparing exit code, stdout, stderr
# and written files with what is declared here. A scenario that asserts nothing
# observable is reported as vacuous, and no scenarios at all means SKIPPED
# rather than a pass.
#
# [e2e]
# build_profile = "release"     # the profile you actually ship
# features = []
# binaries = []                 # defaults to the first built bin target
# timeout_seconds = 60
#
# [[e2e.scenarios]]
# name = "add sums two integers"
# argv = ["add", "1", "2"]
# expect_exit = 0
# expect_stdout_regex = '^3\r?\n?$'
#
# [[e2e.scenarios]]
# name = "divide reports a zero divisor"
# argv = ["divide", "1", "0"]
# expect_failure = true
# expect_stderr_regex = 'division by zero'
