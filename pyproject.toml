[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-proof"
version = "0.1.0"
description = "Evidence-based Rust workspace audit: runs the real toolchain and reports only what it can prove"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Antonio Cantallops Alba" }]
keywords = [
  "rust",
  "cargo",
  "audit",
  "security",
  "supply-chain",
  "clippy",
  "miri",
  "fuzzing",
  "evidence",
  "agent-skills",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
veyra = "veyra_proof.cli:main"

[project.urls]
Homepage = "https://github.com/ExyonQ/Veyra-Proof"
Source = "https://github.com/ExyonQ/Veyra-Proof"
Issues = "https://github.com/ExyonQ/Veyra-Proof/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veyra_proof = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
